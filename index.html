<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>藍色天竺葵 - The Blue Geranium</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <!-- 頂部導航欄：左側人物檔案，右側分數 -->
    <header id="game-header">
      <button id="profile-btn">📁 人物與線索檔案</button>
      <div id="score-box">分數：<span id="score-val">0</span> 分</div>
    </header>

    <!-- 遊戲主畫面 -->
    <main id="vn-screen">
      <!-- 角色圖像顯示區 -->
      <div id="character-container">
        <div id="character-portrait" class="hidden">
          <span id="char-avatar">🕵️‍♀️</span>
          <span id="char-label">角色</span>
        </div>
      </div>

      <!-- 對話框 -->
      <div id="scene-box">
        <div id="speaker-tag">
          <span id="speaker-name">旁白</span>
        </div>
        <p id="dialogue-text">載入遊戲中……</p>
      </div>

      <!-- 互動/問答彈窗 -->
      <div id="quiz-modal" class="hidden">
        <h3 id="quiz-title">📝 案情鑑識挑戰</h3>
        <p id="quiz-question">題目載入中...</p>
        <div id="quiz-options" class="options-container"></div>
        <p id="quiz-feedback" class="feedback-text"></p>
      </div>
    </main>

    <!-- 底部控制按鈕 -->
    <footer id="controls">
      <button id="next-btn">點擊繼續推進 ▶</button>
    </footer>
  </div>

  <!-- 人物檔案彈窗 Modal -->
  <div id="profile-modal" class="modal hidden">
    <div class="modal-content">
      <h2>📂 偵探記事簿（已收集的線索與嫌疑人）</h2>
      <ul id="clue-list">
        <!-- 動態生成線索 -->
      </ul>
      <button id="close-profile-btn" class="opt-btn">關閉檔案</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
