<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>瑪波小姐探案：藍色草的死亡預言</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <header id="game-header">
      <h1>👵 瑪波小姐探案：藍色草之謎</h1>
      <div id="progress">線索解密進度：<span id="step-number">1</span>/6</div>
    </header>

    <main id="vn-screen">
      <!-- 視覺對話框 -->
      <div id="scene-box">
        <div id="speaker-tag">
          <span id="speaker-icon">👤</span>
          <span id="speaker-name">瑪波小姐</span>
        </div>
        <p id="dialogue-text">載入案情資料中……</p>
      </div>

      <!-- 中文課文卡關門檻彈窗 -->
      <div id="quiz-modal" class="hidden">
        <div class="quiz-header">
          <span class="lock-icon">🔒</span>
          <h3>【案情鑑識門檻】須通過課文解析以取得下一條線索！</h3>
        </div>
        <p id="quiz-question">題目載入中...</p>
        <div id="quiz-options" class="options-container"></div>
        <p id="quiz-feedback" class="feedback-text"></p>
      </div>
    </main>

    <footer id="controls">
      <button id="next-btn">點擊推進劇情 ▶</button>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
